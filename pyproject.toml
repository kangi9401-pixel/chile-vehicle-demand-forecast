[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chile-forecast"
version = "0.1.0"
description = "Vehicle demand forecasting for the Chilean auto market using a DeepAR + XGBoost ensemble, driven by synthetic macroeconomic indicators."
requires-python = ">=3.9"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.3,<3",
  "matplotlib>=3.9,<4",
  "scikit-learn>=1.6,<2",
  "scipy>=1.13,<2",
  "xgboost>=2.1,<3",
  "gluonts>=0.16,<1",
  "torch>=2.8,<3",
  "lightning>=2.6,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
filterwarnings = [
  "ignore:Using a non-tuple sequence for multidimensional indexing.*:UserWarning",
  "ignore:You defined a `validation_step` but have no `val_dataloader`.*:UserWarning",
]
